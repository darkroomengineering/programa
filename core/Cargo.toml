[workspace]
members = [
    "crates/programa-domain",
    "crates/programa-ffi",
    "crates/programa-proto",
    "crates/programad",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "io-util", "signal", "sync", "time", "fs", "macros", "process"] }
nix = { version = "0.29", features = ["fs", "term", "process", "socket", "signal", "poll", "user", "uio"] }
libc = "0.2.169"
uuid = { version = "1.11", features = ["v4"] }
base64 = "0.22"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
anyhow = "1.0.95"
tempfile = "3.15"

# programa-domain is linked into programad so the daemon and the in-process
# core (programa-ffi, consumed by the macOS app) share one state model. See
# core/docs/programad.md "Process layer".
programa-domain = { path = "crates/programa-domain" }
programa-proto = { path = "crates/programa-proto" }

# programa_core.dll is not on the latency-sensitive keystroke path (that's
# programa-terminal), so trade codegen speed/size for smaller output:
# opt-level "z" minimizes size, fat LTO + one codegen unit remove cross-crate
# dead code and duplication, strip drops symbols, and panic=abort removes the
# unwinding tables (safe here since a panic crossing the FFI boundary is UB
# either way, so aborting is no worse than unwinding into undefined behavior).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

