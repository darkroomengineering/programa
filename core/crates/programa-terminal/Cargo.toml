[package]
name = "programa-terminal"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alacritty_terminal = "0.26.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[workspace]

[patch.crates-io]
alacritty_terminal = { path = "../../vendor/alacritty_terminal" }

# programa_terminal.dll is latency-sensitive (owns ConPTY read/write on every
# keystroke), so keep opt-level 3 here -- only shrink what doesn't cost
# runtime speed: strip debug symbols, and thin LTO (not fat, to keep codegen
# fast and avoid the whole-program inlining fat LTO does, since that can
# shift instruction-cache behavior on a hot path). codegen-units is left at
# its default (16) for the same reason. panic stays "unwind": a panic inside
# one pane's terminal session should not abort the whole process.
[profile.release]
strip = true
lto = "thin"
