name: Programa
options:
  bundleIdPrefix: com.darkroom.programa
packages:
  Iroh:
    url: https://github.com/manaflow-ai/iroh-ffi.git
    revision: 6710783b85780186e8733bc016868a5867356275
targets:
  Programa:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Programa
      - ../MobileChat/CompanionWire.swift
    dependencies:
      - package: Iroh
        product: IrohLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darkroom.programa.iphone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Programa/Info.plist
      properties:
        CFBundleDisplayName: Programa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan the pairing code displayed by Programa on your Mac.
