name: macOS Compatibility

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs after merge, not on pull requests: the main CI workflow already runs the
# full unit suite on macos-26 for every PR, so this only adds the oldest
# supported runner (macos-15), and a break there is caught one merge later.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "CLI/**"
      - "CLI-MCP/**"
      - "daemon/**"
      - "programaTests/**"
      - "vendor/**"
      - "scripts/**"
      - ".github/workflows/ci-macos-compat.yml"
      - "GhosttyTabs.xcodeproj/**"
      - "ghostty"
      - "ghostty/**"
      - ".gitmodules"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat-tests:
    strategy:
      matrix:
        include:
          - os: macos-15
            timeout: 45
            smoke: true
            # This runner starves async completions partway through the serial
            # suite, timing out a fixed set of tests that are not broken on
            # macOS 15 -- see QUARANTINED_ON_COMPAT in scripts/ci-run-unit-tests.sh
            # for the evidence. Every quarantined test still runs in the main CI
            # workflow, so no coverage is lost.
            quarantine: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PROGRAMA_DERIVED_DATA_DIR: ${{ github.workspace }}/.ci-derived-data-compat
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Pick the latest Xcode installed on the runner. GitHub-hosted macos-14
          # defaults to Xcode 15.4, but the project needs Xcode 16+ (Swift tools
          # version 6.0 required by sentry-cocoa).
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          XCODE_DIR="$XCODE_APP/Contents/Developer"
          if [ ! -d "$XCODE_DIR" ]; then
            echo "No Xcode found under /Applications" >&2
            exit 1
          fi
          echo "Selected: $XCODE_APP"
          # Select globally, not just via DEVELOPER_DIR: with two Xcodes on the
          # runner image, /usr/bin/git shims spawned inside xcodebuild test
          # processes resolve against the system-selected Xcode and exit 72
          # (dual Xcode3Core clash) when it differs from DEVELOPER_DIR.
          sudo xcode-select -s "$XCODE_DIR"
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          XCODE_VER="${XCODE_VERSION_OUTPUT%%$'\n'*}"
          echo "XCODE_VER=$XCODE_VER" >> "$GITHUB_ENV"
          echo "$XCODE_VERSION_OUTPUT"
          xcrun --sdk macosx --show-sdk-path
          sw_vers

      - name: Resolve Ghostty revision
        id: ghostty-revision
        run: |
          set -euo pipefail
          revision="$(./scripts/ghostty_cache_revision.sh)"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-v3-${{ steps.ghostty-revision.outputs.revision }}

      - name: Resolve zig version
        id: zig-version
        run: printf 'version=%s\n' "$(./scripts/required-zig-version.sh)" >> "$GITHUB_OUTPUT"

      # install-zig.sh re-checks the tarball against scripts/zig-macos-aarch64.sha256
      # on every run, so a cache hit never skips the checksum.
      - name: Cache zig toolchain tarball
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/programa-zig-dist
          key: zig-dist-macos-arm64-${{ steps.zig-version.outputs.version }}

      - name: Set up required Zig
        run: ./scripts/install-zig.sh

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache DerivedData
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.PROGRAMA_DERIVED_DATA_DIR }}
          key: deriveddata-v2-${{ matrix.os }}-${{ env.XCODE_VER }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-v2-${{ matrix.os }}-${{ env.XCODE_VER }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            deriveddata-v2-${{ matrix.os }}-${{ env.XCODE_VER }}-

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .ci-source-packages
          key: spm-${{ matrix.os }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ matrix.os }}-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project GhosttyTabs.xcodeproj -scheme programa-unit -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      # ---------------------------------------------------------------------
      # Ordering is the whole point of this job's shape, so it is documented
      # rather than left implicit.
      #
      # What only THIS job can tell you is whether Programa builds and launches
      # on a macOS version other than the one `release.yml` ships from. That is
      # the build + smoke steps below, and they now run FIRST and gate the job.
      #
      # The full ~1,500-test unit suite runs after the build and smoke steps, not
      # before them, for two reasons:
      #
      #   1. Those tests are OS-agnostic logic and already run on every PR in
      #      ci.yml. Re-running them on more macOS versions gives no unique
      #      signal.
      #   2. They can fail on the macos-15 runner (async starvation, see
      #      QUARANTINED_ON_COMPAT in scripts/ci-run-unit-tests.sh). If they
      #      gated the job, a failure would skip the build and smoke steps,
      #      the actual point, and the job would never verify compatibility.
      #
      # Unit tests still run here, after, and are informational: a failure
      # marks the step red without failing the job. That keeps the data (and the
      # uploaded xcresult bundles) without letting OS-agnostic test noise mask
      # the one result this job exists to produce.
      # ---------------------------------------------------------------------

      - name: Build app
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
            -derivedDataPath "$PROGRAMA_DERIVED_DATA_DIR" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" build

      - name: Create virtual display
        if: matrix.smoke
        run: |
          set -euo pipefail
          echo "=== Display before ==="
          system_profiler SPDisplaysDataType 2>/dev/null || echo "(no display info)"
          echo ""
          clang -framework Foundation -framework CoreGraphics \
            -o /tmp/create-virtual-display scripts/create-virtual-display.m
          /tmp/create-virtual-display &
          VDISPLAY_PID=$!
          echo "VDISPLAY_PID=$VDISPLAY_PID" >> "$GITHUB_ENV"
          sleep 3
          echo "=== Display after ==="
          system_profiler SPDisplaysDataType 2>/dev/null || echo "(no display info)"

      - name: Smoke test
        if: matrix.smoke
        run: |
          set -euo pipefail
          chmod +x scripts/smoke-test-ci.sh
          scripts/smoke-test-ci.sh

      # Informational. See the ordering note above: this is coverage ci.yml
      # already provides, kept here only because a genuine OS difference could
      # in principle surface in it. It must not gate the job -- that is what
      # hid the smoke test for over a week.
      - name: Run unit tests (informational)
        id: compat_unit_tests
        continue-on-error: true
        env:
          # Keep hosted test bundles out of the app-build cache. Otherwise a
          # restored unsigned programaTests.xctest invalidates app code signing.
          PROGRAMA_DERIVED_DATA_DIR: ${{ github.workspace }}/.ci-derived-data-compat-tests
          PROGRAMA_UNIT_TEST_SCOPE: serial
          PROGRAMA_UNIT_TEST_QUARANTINE: ${{ matrix.quarantine && '1' || '' }}
        run: |
          ./scripts/ci-run-unit-tests.sh

      # always(), not failure(): the unit-test step is continue-on-error, so the
      # job is green even when it fails and failure() would never fire.
      - name: Collect ghostty crash reports
        if: always()
        run: |
          mkdir -p /tmp/programa-unit-xcresults
          cp -R "$HOME/.local/state/ghostty/crash" /tmp/programa-unit-xcresults/ghostty-crash 2>/dev/null || true

      - name: Upload unit-test result bundles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-xcresults-${{ matrix.os }}-${{ github.run_attempt }}
          path: /tmp/programa-unit-xcresults/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report informational unit-test outcome
        if: always()
        run: |
          outcome='${{ steps.compat_unit_tests.outcome }}'
          echo "Unit tests (informational) on ${{ matrix.os }}: $outcome"
          if [ "$outcome" != "success" ]; then
            echo "::warning title=Unit tests failed on ${{ matrix.os }}::Informational only — this did not fail the job. See the uploaded xcresult bundle. The gating signal for this job is the build and smoke test above."
          fi
