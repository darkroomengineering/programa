name: ship-windows

# Builds the Windows Velopack installer and update feed. A dispatch from ship supplies the
# build identity and owns the tag and publish. A manual publish from main owns both.
run-name: ship windows ${{ inputs.dispatch_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      version: { type: string, default: "" }
      build: { type: string, default: "" }
      commit: { type: string, default: "" }
      dispatch_id: { type: string, default: "" }
      dry-run: { type: boolean, default: false }

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SHIP_DRY_RUN: ${{ inputs.dry-run }}
      SHIP_RUN_VERSION: ${{ inputs.version }}
      SHIP_RUN_BUILD: ${{ inputs.build }}
      SHIP_RUN_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          persist-credentials: false

      - name: Check out application main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          path: app
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Build and pack Windows
        working-directory: app
        run: bun ../workflow/scripts/ship-windows.ts build

      - name: Upload release assets
        if: ${{ !inputs.dry-run && github.ref == 'refs/heads/main' }}
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun ../workflow/scripts/ship-windows.ts publish

      - name: Keep the packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-lane-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shipit-windows-*
          if-no-files-found: ignore
          retention-days: 7
