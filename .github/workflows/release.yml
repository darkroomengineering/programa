name: Release desktop apps

# Single-lane release pipeline for the macOS and Windows desktop artifacts.
# - workflow_run: every successful `main` CI run builds and seals a unique draft candidate;
#     a serialized reconciler advances the mutable aliases, metadata, and ref on `rolling`,
#     then deletes the previous candidate draft, keeping at most one candidate draft around
#     as a private (non-public) rollback archive. Candidates are never published, so the
#     releases page always shows exactly the one `rolling` entry.
# - workflow_dispatch: dry-run build that uploads an artifact instead of publishing.
#
# Milestone marketing-version bumps (`scripts/bump-version.sh` + `git tag vX.Y.Z`) are git
# tags only; they do not create a GitHub release. See CLAUDE.md "Release".
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

env:
  CREATE_DMG_VERSION: 8.0.0

concurrency:
  group: ${{ format('programa-release-{0}-{1}', github.run_id, github.run_attempt) }}
  queue: max
  cancel-in-progress: false

jobs:
  release-identity:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.sha == github.event.workflow_run.head_sha)
    runs-on: ubuntu-latest
    outputs:
      effective_build: ${{ steps.version.outputs.effective_build }}
      effective_version: ${{ steps.version.outputs.effective_version }}
      target_sha: ${{ steps.version.outputs.target_sha }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      payload_release_tag: ${{ steps.version.outputs.payload_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # For workflow_run, github.ref/github.sha resolve to the default branch's
          # workflow definition, not the commit that triggered CI. Pin to the exact
          # commit CI validated.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate CI provenance against current main
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const upstream = context.payload.workflow_run;
            if (upstream.event !== 'push' || upstream.head_branch !== 'main') {
              core.setFailed('Rolling releases require a successful push CI run on main.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(upstream.head_sha)) {
              core.setFailed('The upstream CI head SHA is not a canonical commit SHA.');
              return;
            }
            if (context.sha !== upstream.head_sha) {
              core.setFailed(
                `Release provenance SHA ${context.sha} does not match upstream CI SHA ${upstream.head_sha}.`
              );
              return;
            }
            const mainRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (mainRef.data.object.sha !== upstream.head_sha) {
              core.setFailed(
                `Upstream CI SHA ${upstream.head_sha} is no longer current main ${mainRef.data.object.sha}.`
              );
            }

      - name: Determine release tag and effective build number
        id: version
        env:
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          PROJECT_FILE="GhosttyTabs.xcodeproj/project.pbxproj"
          MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION = ' "$PROJECT_FILE" | sed 's/.*= //;s/;.*//')

          # Sparkle build number (CFBundleVersion) is ALWAYS derived from the monotonic
          # GitHub run ID — for BOTH auto-ship and milestone-tag releases — so there is a
          # single strictly-increasing build-number sequence across the one feed. The
          # committed CURRENT_PROJECT_VERSION is only a local-dev default and is
          # intentionally NOT used for shipping: mixing a small committed build with
          # run-ID builds would make the first milestone tag after any auto-ship fail the
          # monotonic guard below (and Sparkle would never offer it). Marketing version
          # (CFBundleShortVersionString, baked in at build time) carries the human semver.
          EFFECTIVE_BUILD="$(node <<'NODE'
          "use strict";
          const { deriveReleaseBuildIdentity } = require("./scripts/release_build_identity");
          process.stdout.write(deriveReleaseBuildIdentity({
            eventName: process.env.GITHUB_EVENT_NAME,
            upstreamRunId: process.env.UPSTREAM_RUN_ID,
            upstreamRunAttempt: process.env.UPSTREAM_RUN_ATTEMPT,
            workflowRunId: process.env.WORKFLOW_RUN_ID,
            workflowRunAttempt: process.env.WORKFLOW_RUN_ATTEMPT,
          }));
          NODE
          )"

          # Auto-ship from main (workflow_run) or dry-run (workflow_dispatch): keep the
          # user-facing latest surface on the reused mutable `rolling` release while every
          # build-specific payload targets its own draft candidate.
          RELEASE_TAG="rolling"
          PAYLOAD_RELEASE_TAG="rolling-candidate-${EFFECTIVE_BUILD}"
          # Every auto-ship gets a DISTINCT user-visible version: keep the committed
          # major.minor and replace the patch with the monotonic workflow run number.
          # Shipping every rolling build as the same committed semver (e.g. "0.4.0")
          # left users unable to tell builds apart in the about box and on the
          # releases page. Injected at build time like EFFECTIVE_BUILD — never
          # committed back, so no commit loop. Minor bumps stay manual milestone git
          # tags (scripts/bump-version.sh); the patch sequence continues across them,
          # which keeps versions strictly increasing in Sparkle-visible order.
          EFFECTIVE_MARKETING_VERSION="${MARKETING_VERSION%.*}.${GITHUB_RUN_NUMBER}"

          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> "$GITHUB_ENV"
          echo "EFFECTIVE_MARKETING_VERSION=${EFFECTIVE_MARKETING_VERSION}" >> "$GITHUB_ENV"
          echo "EFFECTIVE_BUILD=${EFFECTIVE_BUILD}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "PAYLOAD_RELEASE_TAG=${PAYLOAD_RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "effective_build=${EFFECTIVE_BUILD}" >> "$GITHUB_OUTPUT"
          echo "effective_version=${EFFECTIVE_MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "payload_release_tag=${PAYLOAD_RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Marketing version: ${MARKETING_VERSION} (effective: ${EFFECTIVE_MARKETING_VERSION})"
          echo "Effective build: ${EFFECTIVE_BUILD}"
          echo "Release tag: ${RELEASE_TAG}"

  build-sign-notarize:
    needs: [release-identity]
    if: >-
      always() &&
      needs.release-identity.result == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EFFECTIVE_BUILD: ${{ needs.release-identity.outputs.effective_build }}
      EFFECTIVE_MARKETING_VERSION: ${{ needs.release-identity.outputs.effective_version }}
      RELEASE_TAG: ${{ needs.release-identity.outputs.release_tag }}
      PAYLOAD_RELEASE_TAG: ${{ needs.release-identity.outputs.payload_release_tag }}
      TARGET_SHA: ${{ needs.release-identity.outputs.target_sha }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-identity.outputs.target_sha }}
          submodules: recursive

      - name: Guard Sparkle build number is monotonic
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EFFECTIVE_BUILD: ${{ env.EFFECTIVE_BUILD }}
        with:
          script: |
            const { enforceSparkleMonotonicBuild } = require('./scripts/sparkle_monotonic_guard');
            await enforceSparkleMonotonicBuild({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              effectiveBuild: process.env.EFFECTIVE_BUILD,
            });
            core.notice(`Sparkle build ${process.env.EFFECTIVE_BUILD} is newer than the latest release.`);

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Prefer Xcode 26 (macOS 26 SDK) so NSGlassEffectView / Liquid Glass compiles;
          # fall back to the image default when no Xcode 26 install exists.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_APP" ] && [ -d "/Applications/Xcode.app" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          XCODE_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR" || true
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install build deps
        run: |
          ZIG_REQUIRED="$(./scripts/required-zig-version.sh)"
          if command -v zig >/dev/null 2>&1 && [ "$(zig version 2>/dev/null)" = "$ZIG_REQUIRED" ]; then
            echo "zig ${ZIG_REQUIRED} already installed"
          else
            echo "Installing zig ${ZIG_REQUIRED} from tarball"
            curl -fSL "https://ziglang.org/download/${ZIG_REQUIRED}/zig-aarch64-macos-${ZIG_REQUIRED}.tar.xz" -o /tmp/zig.tar.xz
            tar xf /tmp/zig.tar.xz -C /tmp
            sudo mkdir -p /usr/local/bin /usr/local/lib
            sudo cp -f /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/zig /usr/local/bin/zig
            sudo cp -rf /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/lib /usr/local/lib/zig
            export PATH="/usr/local/bin:$PATH"
            zig version
          fi
          ./scripts/install-create-dmg.sh

      - name: Resolve Ghostty revision
        id: ghostty-revision
        run: |
          set -euo pipefail
          revision="$(./scripts/ghostty_cache_revision.sh)"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit-release
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-v3-${{ steps.ghostty-revision.outputs.revision }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit-release.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .spm-cache
          key: spm-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Derive Sparkle public key from private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          DERIVED_PUBLIC_KEY=$(swift scripts/derive_sparkle_public_key.swift "$SPARKLE_PRIVATE_KEY")
          echo "Derived Sparkle public key: $DERIVED_PUBLIC_KEY"
          echo "SPARKLE_PUBLIC_KEY=$DERIVED_PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Prepare Rust targets for the shared core
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal app (Release)
        run: |
          xcodebuild -scheme programa -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build

      - name: Verify binary architectures
        run: |
          ./scripts/verify-release-architectures.sh \
            "build-universal/Build/Products/Release/Programa.app/Contents/MacOS/Programa" \
            "build-universal/Build/Products/Release/Programa.app/Contents/Resources/bin/programa" \
            "build-universal/Build/Products/Release/Programa.app/Contents/Resources/bin/ghostty"

      - name: Archive dSYMs
        run: |
          set -euo pipefail
          # dwarf-with-dsym (Release config) writes each target's .dSYM next to its
          # product in Build/Products/Release — same derived-data layout the app
          # build and architecture check above already rely on.
          DSYM_DIR="build-universal/Build/Products/Release"
          DSYM_ZIP="programa-dSYMs-${EFFECTIVE_BUILD}.zip"
          DSYM_PATHS=()
          while IFS= read -r -d '' path; do
            DSYM_PATHS+=("$path")
          done < <(find "$DSYM_DIR" -maxdepth 1 -name '*.dSYM' -print0)
          if [ "${#DSYM_PATHS[@]}" -eq 0 ]; then
            echo "No .dSYM bundles found under $DSYM_DIR" >&2
            exit 1
          fi
          zip -r -y "$DSYM_ZIP" "${DSYM_PATHS[@]}"

      - name: Stamp effective version and build number in Info.plist
        run: |
          set -euo pipefail
          APP_PLIST="build-universal/Build/Products/Release/Programa.app/Contents/Info.plist"
          # No-op for tag releases (both values already match the committed ones).
          # For auto-ship runs this stamps the monotonic run-derived build number AND
          # the distinct per-ship marketing version (major.minor.run_number) without
          # committing anything back to the repo.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${EFFECTIVE_BUILD}" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${EFFECTIVE_MARKETING_VERSION}" "$APP_PLIST"

      - name: Run CLI version memory guard regression
        run: |
          set -euo pipefail
          CLI_BINARY="build-universal/Build/Products/Release/Programa.app/Contents/Resources/bin/programa"
          [ -x "$CLI_BINARY" ] || { echo "programa CLI binary not found at $CLI_BINARY" >&2; exit 1; }
          PROGRAMA_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_version_memory_guard.py

      - name: Verify bundled Ghostty theme picker helper
        run: |
          set -euo pipefail
          HELPER_BINARY="build-universal/Build/Products/Release/Programa.app/Contents/Resources/bin/ghostty"
          [ -x "$HELPER_BINARY" ] || { echo "Ghostty theme picker helper not found at $HELPER_BINARY" >&2; exit 1; }

      - name: Inject Sparkle keys into Info.plist
        run: |
          APP_PLIST="build-universal/Build/Products/Release/Programa.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$APP_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$APP_PLIST" >/dev/null 2>&1 || true
          echo "Adding SUPublicEDKey to Info.plist..."
          /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string ${SPARKLE_PUBLIC_KEY}" "$APP_PLIST"
          echo "Adding SUFeedURL to Info.plist..."
          /usr/libexec/PlistBuddy -c "Add :SUFeedURL string https://github.com/darkroomengineering/programa/releases/latest/download/appcast.xml" "$APP_PLIST"
          echo "Verifying:"
          /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$APP_PLIST"

      - name: Import signing cert
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Missing APPLE_CERTIFICATE_BASE64 secret" >&2
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Missing APPLE_CERTIFICATE_PASSWORD secret" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Import provisioning profile
        env:
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          # REQUIRED now, despite the name of the check below. The app declares
          # restricted entitlements (CloudKit), and an app carrying those with no
          # embedded profile is killed by AMFI at launch for every user (POSIX 163)
          # after signing and notarizing cleanly. This step still tolerates the
          # secret being absent so the failure is reported by
          # verify-provision-profile.sh with a full explanation, rather than as a
          # bare base64 error here — that script is the gate, and it fails the
          # build. Do not "fix" a red verify step by removing it.
          if [ -z "$APPLE_PROVISION_PROFILE_BASE64" ]; then
            echo "No APPLE_PROVISION_PROFILE_BASE64 secret set; skipping profile embedding."
            echo "The build will fail verification: this app declares restricted entitlements."
            echo "PROGRAMA_PROVISION_PROFILE=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > /tmp/programa.provisionprofile
          echo "PROGRAMA_PROVISION_PROFILE=/tmp/programa.provisionprofile" >> "$GITHUB_ENV"

      - name: Codesign app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_SIGNING_IDENTITY secret" >&2
            exit 1
          fi
          APP_PATH="build-universal/Build/Products/Release/Programa.app"
          CLI_PATH="$APP_PATH/Contents/Resources/bin/programa"
          HELPER_PATH="$APP_PATH/Contents/Resources/bin/ghostty"
          MCP_PATH="$APP_PATH/Contents/Resources/bin/programa-mcp"
          ./scripts/sign-release-app.sh "$APP_PATH" "$APPLE_SIGNING_IDENTITY" programa.entitlements
          ./scripts/verify-release-entitlements.sh "$APP_PATH" "$CLI_PATH" "$HELPER_PATH" "$MCP_PATH"
          ./scripts/verify-provision-profile.sh "$APP_PATH"

      - name: Verify embedded Sparkle artifact
        run: |
          ./scripts/verify_sparkle_artifact.sh \
            "build-universal/Build/Products/Release/Programa.app" \
            "2.9.6"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing notarization secrets (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)" >&2
            exit 1
          fi
          APP_PATH="build-universal/Build/Products/Release/Programa.app"
          ZIP_SUBMIT="programa-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_SUBMIT"
          APP_SUBMIT_JSON="$(xcrun notarytool submit "$ZIP_SUBMIT" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --output-format json)"
          APP_SUBMIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$APP_SUBMIT_JSON")"
          APP_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$APP_SUBMIT_JSON")"
          if [ "$APP_STATUS" != "Accepted" ]; then
            echo "App notarization failed with status: $APP_STATUS" >&2
            xcrun notarytool log "$APP_SUBMIT_ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv --type execute "$APP_PATH"
          rm -f "$ZIP_SUBMIT"

      - name: Create signed DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          [[ -n "${APPLE_SIGNING_IDENTITY}" ]] || {
            echo "Missing APPLE_SIGNING_IDENTITY secret" >&2
            exit 1
          }
          APP_PATH="build-universal/Build/Products/Release/Programa.app"
          DMG_RELEASE="programa-macos.dmg"
          # create-dmg generates a styled drag-to-install DMG
          create-dmg \
            --identity="$APPLE_SIGNING_IDENTITY" \
            "$APP_PATH" \
            ./
          # create-dmg names the DMG after the app bundle, e.g. "Programa 0.1.0.dmg".
          # GitHub macOS runners use a case-sensitive filesystem, so the glob must match
          # the capitalized product name exactly.
          mv ./Programa*.dmg "$DMG_RELEASE"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing notarization secrets (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)" >&2
            exit 1
          fi
          DMG_RELEASE="programa-macos.dmg"
          DMG_SUBMIT_JSON="$(xcrun notarytool submit "$DMG_RELEASE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --output-format json)"
          DMG_SUBMIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$DMG_SUBMIT_JSON")"
          DMG_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$DMG_SUBMIT_JSON")"
          if [ "$DMG_STATUS" != "Accepted" ]; then
            echo "DMG notarization failed with status: $DMG_STATUS" >&2
            xcrun notarytool log "$DMG_SUBMIT_ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$DMG_RELEASE"
          xcrun stapler validate "$DMG_RELEASE"

      - name: Create build-specific DMG alias
        run: |
          set -euo pipefail
          DMG_RELEASE="programa-macos.dmg"
          # Publish the same bytes twice: programa-macos.dmg is the stable README
          # download button, and programa-macos-<build>.dmg is what Sparkle's appcast
          # points at. The publisher retains each build archive and never overwrites its
          # payload assets, so the EdDSA signature always matches that URL. See
          # scripts/sparkle_enclosure.js for why (SUSparkleErrorDomain 4005, 2026-07-24).
          ENCLOSURE_DMG="$(node scripts/sparkle_enclosure.js name "$EFFECTIVE_BUILD")"
          cp "$DMG_RELEASE" "$ENCLOSURE_DMG"
          echo "ENCLOSURE_DMG=${ENCLOSURE_DMG}" >> "$GITHUB_ENV"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          ./scripts/sparkle_generate_appcast.sh programa-macos.dmg "$PAYLOAD_RELEASE_TAG" appcast.xml "$ENCLOSURE_DMG"

      - name: Collect macOS release payload
        run: |
          set -euo pipefail
          MACOS_PAYLOAD_DIR="${RUNNER_TEMP}/programa-macos-payload"
          mkdir "$MACOS_PAYLOAD_DIR"
          cp appcast.xml "$MACOS_PAYLOAD_DIR/"
          cp "programa-dSYMs-${EFFECTIVE_BUILD}.zip" "$MACOS_PAYLOAD_DIR/"
          cp "programa-macos-${EFFECTIVE_BUILD}.dmg" "$MACOS_PAYLOAD_DIR/"
          cp programa-macos.dmg "$MACOS_PAYLOAD_DIR/"
          [[ "$(find "$MACOS_PAYLOAD_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 4 ]]

      - name: Upload macOS release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: programa-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/programa-macos-payload/
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12
          rm -f /tmp/programa.provisionprofile

  build-windows:
    needs: [release-identity]
    if: >-
      always() &&
      needs.release-identity.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EFFECTIVE_BUILD: ${{ needs.release-identity.outputs.effective_build }}
      EFFECTIVE_MARKETING_VERSION: ${{ needs.release-identity.outputs.effective_version }}
      TARGET_SHA: ${{ needs.release-identity.outputs.target_sha }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-identity.outputs.target_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:RUNNER_TEMP "programa-windows-payload"
          New-Item -ItemType Directory -Path $output | Out-Null
          & ./scripts/build-windows.ps1 `
            -Version $env:EFFECTIVE_MARKETING_VERSION `
            -Build $env:EFFECTIVE_BUILD `
            -Commit $env:TARGET_SHA `
            -OutputDirectory $output

          $stableName = "programa-windows.exe"
          $immutableName = "programa-windows-$($env:EFFECTIVE_BUILD).exe"
          $files = @(Get-ChildItem -LiteralPath $output -File)
          if ($files.Count -ne 2) {
            throw "Windows payload directory must contain exactly two files"
          }
          foreach ($name in @($stableName, $immutableName)) {
            if (-not (Test-Path -LiteralPath (Join-Path $output $name) -PathType Leaf)) {
              throw "Missing Windows release payload: $name"
            }
          }
          $stableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $output $stableName)).Hash
          $immutableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $output $immutableName)).Hash
          if ($stableHash -ne $immutableHash) {
            throw "Stable and immutable Windows executables are not byte-identical"
          }
          # WinExe apps return to PowerShell immediately unless a pipeline forces a wait.
          $versionOutput = & (Join-Path $output $stableName) --version | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Windows executable --version failed with exit code $LASTEXITCODE"
          }
          $versionText = $versionOutput -join "`n"
          foreach ($value in @($env:EFFECTIVE_MARKETING_VERSION, $env:EFFECTIVE_BUILD, $env:TARGET_SHA)) {
            if (-not $versionText.Contains($value)) {
              throw "Windows executable --version omitted release identity $value"
            }
          }

      - name: Attest Windows release payloads
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            ${{ runner.temp }}/programa-windows-payload/programa-windows-${{ env.EFFECTIVE_BUILD }}.exe
            ${{ runner.temp }}/programa-windows-payload/programa-windows.exe

      - name: Upload Windows release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: programa-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/programa-windows-payload/
          if-no-files-found: error

  assemble-release:
    needs: [release-identity, build-sign-notarize, build-windows]
    if: >-
      always() &&
      needs.release-identity.result == 'success' &&
      needs.build-sign-notarize.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    env:
      EFFECTIVE_BUILD: ${{ needs.release-identity.outputs.effective_build }}
      EFFECTIVE_MARKETING_VERSION: ${{ needs.release-identity.outputs.effective_version }}
      RELEASE_TAG: ${{ needs.release-identity.outputs.release_tag }}
      PAYLOAD_RELEASE_TAG: ${{ needs.release-identity.outputs.payload_release_tag }}
      TARGET_SHA: ${{ needs.release-identity.outputs.target_sha }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-identity.outputs.target_sha }}

      - name: Download macOS payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: programa-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/macos

      - name: Download Windows payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: programa-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/windows

      - name: Assemble exact release payload
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PAYLOAD_DIR="${RUNNER_TEMP}/programa-release-payload"
          mkdir "$PAYLOAD_DIR"
          expected=(
            appcast.xml
            "programa-dSYMs-${EFFECTIVE_BUILD}.zip"
            "programa-macos-${EFFECTIVE_BUILD}.dmg"
            "programa-windows-${EFFECTIVE_BUILD}.exe"
            programa-macos.dmg
            programa-windows.exe
          )
          [[ "$(find incoming/macos -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 4 ]]
          [[ "$(find incoming/windows -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 2 ]]
          source_dir="incoming"
          for name in "${expected[@]}"; do
            matches=()
            while IFS= read -r -d '' match; do matches+=("$match"); done < <(find "$source_dir" -type f -name "$name" -print0)
            [[ "${#matches[@]}" == 1 ]] || {
              echo "Expected exactly one $name in the release handoff, found ${#matches[@]}" >&2
              exit 1
            }
            cp "${matches[0]}" "$PAYLOAD_DIR/$name"
          done
          [[ "$(find "$PAYLOAD_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == 6 ]]
          cmp -s "$PAYLOAD_DIR/programa-macos-${EFFECTIVE_BUILD}.dmg" "$PAYLOAD_DIR/programa-macos.dmg"
          cmp -s "$PAYLOAD_DIR/programa-windows-${EFFECTIVE_BUILD}.exe" "$PAYLOAD_DIR/programa-windows.exe"
          echo "PAYLOAD_DIR=${PAYLOAD_DIR}" >> "$GITHUB_ENV"

      - name: Require current main before rolling candidate creation
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          CHECKED_OUT_TARGET="$(git rev-parse HEAD)"
          [[ "$CHECKED_OUT_TARGET" == "$TARGET_SHA" ]]
          [[ "$CURRENT_MAIN" == "$TARGET_SHA" ]] || {
            echo "CI-validated target ${TARGET_SHA} is no longer current main ${CURRENT_MAIN}" >&2
            exit 1
          }

      - name: Prepare combined release candidate seal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CANDIDATE_SEAL="${RUNNER_TEMP}/programa-release-candidate.json"
          CANDIDATE_PREFIX=rolling-candidate-
          CANDIDATE_TAG="$PAYLOAD_RELEASE_TAG"
          DESTINATION_TAG="$PAYLOAD_RELEASE_TAG"
          ./scripts/publish_release_candidate.sh \
            --prepare-only \
            --candidate-prefix "$CANDIDATE_PREFIX" \
            --destination-tag "$DESTINATION_TAG" \
            --candidate-tag "$CANDIDATE_TAG" \
            --target-sha "$TARGET_SHA" \
            --build "$EFFECTIVE_BUILD" \
            --version "$EFFECTIVE_MARKETING_VERSION" \
            --seal-output "$CANDIDATE_SEAL" \
            --asset-role "immutable=${PAYLOAD_DIR}/programa-macos-${EFFECTIVE_BUILD}.dmg" \
            --asset-role "immutable=${PAYLOAD_DIR}/programa-dSYMs-${EFFECTIVE_BUILD}.zip" \
            --asset-role "immutable=${PAYLOAD_DIR}/programa-windows-${EFFECTIVE_BUILD}.exe" \
            --asset-role "appcast=${PAYLOAD_DIR}/appcast.xml" \
            --asset-role "stable-alias=${PAYLOAD_DIR}/programa-macos.dmg" \
            --asset-role "stable-alias=${PAYLOAD_DIR}/programa-windows.exe"
          {
            echo "CANDIDATE_SEAL=${CANDIDATE_SEAL}"
            echo "CANDIDATE_PREFIX=${CANDIDATE_PREFIX}"
            echo "CANDIDATE_TAG=${CANDIDATE_TAG}"
            echo "DESTINATION_TAG=${DESTINATION_TAG}"
          } >> "$GITHUB_ENV"

      - name: Attest combined release payloads
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            ${{ env.PAYLOAD_DIR }}/programa-macos-${{ env.EFFECTIVE_BUILD }}.dmg
            ${{ env.PAYLOAD_DIR }}/programa-dSYMs-${{ env.EFFECTIVE_BUILD }}.zip
            ${{ env.PAYLOAD_DIR }}/programa-windows-${{ env.EFFECTIVE_BUILD }}.exe
            ${{ env.PAYLOAD_DIR }}/appcast.xml
            ${{ env.PAYLOAD_DIR }}/programa-macos.dmg
            ${{ env.PAYLOAD_DIR }}/programa-windows.exe

      - name: Attest combined release candidate seal
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ env.CANDIDATE_SEAL }}

      - name: Stage combined release candidate
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/publish_release_candidate.sh \
            --candidate-prefix "$CANDIDATE_PREFIX" \
            --destination-tag "$DESTINATION_TAG" \
            --candidate-tag "$CANDIDATE_TAG" \
            --target-sha "$TARGET_SHA" \
            --build "$EFFECTIVE_BUILD" \
            --version "$EFFECTIVE_MARKETING_VERSION" \
            --seal-output "$CANDIDATE_SEAL" \
            --asset-role "immutable=${PAYLOAD_DIR}/programa-macos-${EFFECTIVE_BUILD}.dmg" \
            --asset-role "immutable=${PAYLOAD_DIR}/programa-dSYMs-${EFFECTIVE_BUILD}.zip" \
            --asset-role "immutable=${PAYLOAD_DIR}/programa-windows-${EFFECTIVE_BUILD}.exe" \
            --asset-role "appcast=${PAYLOAD_DIR}/appcast.xml" \
            --asset-role "stable-alias=${PAYLOAD_DIR}/programa-macos.dmg" \
            --asset-role "stable-alias=${PAYLOAD_DIR}/programa-windows.exe"

      - name: Upload combined build artifacts (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: programa-release-dry-run
          path: ${{ env.PAYLOAD_DIR }}/
          if-no-files-found: error

  promote-rolling:
    needs: [release-identity, assemble-release]
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: programa-release-publication
      queue: max
    steps:
      - name: Checkout CI-validated revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Reconcile highest sealed candidate to rolling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXPECTED_TARGET="${{ github.event.workflow_run.head_sha }}"
          CHECKED_OUT_TARGET="$(git rev-parse HEAD)"
          [[ "$CHECKED_OUT_TARGET" == "$EXPECTED_TARGET" ]] || {
            echo "Checked-out revision ${CHECKED_OUT_TARGET} does not match reconciler target ${EXPECTED_TARGET}" >&2
            exit 1
          }
          ./scripts/publish_rolling_release.sh \
            --candidate-prefix rolling-candidate- \
            --rolling-tag rolling \
            --reconciler-target-sha "$EXPECTED_TARGET"
