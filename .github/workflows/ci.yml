name: CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "Sources/**"
      - "CLI/**"
      - "CLI-MCP/**"
      - "programaTests/**"
      - "tests/**"
      - "tests_v2/**"
      - "Resources/**"
      - "Assets.xcassets/**"
      - "vendor/**"
      - "windows/**"
      - "core/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "GhosttyTabs.xcodeproj/**"
      - "programa.entitlements"
      - "programa-Bridging-Header.h"
      - "ghostty.h"
      - "session_escrow_shim.c"
      - "session_escrow_shim.h"
      # The bare "ghostty" entry catches submodule pointer bumps, which
      # "ghostty/**" alone misses.
      - "ghostty"
      - "ghostty/**"
      - ".gitmodules"
  # On-demand runs, so the typing-lag regression can be measured on a branch
  # BEFORE it merges. Without this the lag job only ever ran post-merge on main,
  # which made "measure p95 before and after" impossible to do pre-merge and left
  # perf changes to the keystroke path effectively unverifiable until too late.
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run shared-core and Windows checks without the macOS test jobs
        type: boolean
        default: false
      lag_combo:
        description: >-
          Key the typing-lag harness repeats. "up" (the default, and what
          scheduled runs use) exercises the per-event hit-test path. A printable
          key such as "a" additionally reaches shouldRefreshAfterTextInput and
          therefore forceRefresh, which the arrow key never does -- the only way
          to measure the text-input half of the keystroke path.
        type: string
        default: up
      glass_surface:
        description: Liquid Glass surface measured as three OFF and three ON lag-harness runs.
        type: choice
        options:
          - window
          - sidebar
          - tabBar
          - browserToolbar
          - overlays
        default: window

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    runs-on: ubuntu-latest
    outputs:
      run_app_jobs: ${{ steps.detect.outputs.run_app_jobs }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate immutable workflow action pins
        run: ./scripts/validate-workflow-action-pins.py

      - name: Enforce structural lifecycle budgets
        run: ./scripts/check-structural-budgets.py

      - name: Validate deterministic app discovery
        run: ./tests/test_locate_built_app.sh

      - name: Detect changed files
        id: detect
        env:
          WINDOWS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_only }}
        run: |
          set -euo pipefail

          if [[ "$WINDOWS_ONLY" == "true" ]]; then
            echo "run_app_jobs=false" >> "$GITHUB_OUTPUT"
            echo "Manual Windows verification: macOS jobs excluded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Keep full CI for push events and non-PR runs.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_app_jobs=true" >> "$GITHUB_OUTPUT"
            echo "Changed files: full suite (non-PR context)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          CLASSIFICATION="$(printf '%s' "$CHANGED_FILES" | ./scripts/classify_ci_changes.sh)"
          APP_OUTPUT="${CLASSIFICATION%%$'\n'*}"

          if [[ "$APP_OUTPUT" != "$CLASSIFICATION" ]]; then
            echo "CI change classifier returned an invalid output shape" >&2
            exit 1
          fi

          case "$APP_OUTPUT" in
            run_app_jobs=true) RUN_APP_JOBS=true ;;
            run_app_jobs=false) RUN_APP_JOBS=false ;;
            *)
              echo "CI change classifier returned an invalid app result" >&2
              exit 1
              ;;
          esac

          printf '%s\n' "$CLASSIFICATION" >> "$GITHUB_OUTPUT"
          {
            echo "### CI scope decision"
            if [[ "$RUN_APP_JOBS" == "true" ]]; then
              echo "Changed file set contains app-relevant changes; running full macOS jobs."
            else
              echo "Pull request appears docs/workflow/localization-only; skipping heavy app jobs."
            fi
            echo ""
            echo "Changed files:"
            if [[ -z "${CHANGED_FILES}" ]]; then
              echo "- <none>"
            else
              printf '%s\n' "${CHANGED_FILES}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  workflow-guard-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate GhosttyKit lock ownership
        run: ./tests/test_ensure_ghosttykit_locking.sh

      - name: Validate create-dmg version pinning
        run: ./tests/test_ci_create_dmg_pinned.sh

      - name: Validate unit-test runner behavior
        run: ./tests/test_ci_unit_test_runner_behavior.sh

      - name: Validate GhosttyKit checksum verification
        run: ./tests/test_ci_ghosttykit_checksum_verification.sh

      - name: Validate release artifact architecture checks
        run: ./tests/test_ci_universal_release_settings.sh

      - name: Validate rolling release publication
        run: ./tests/test_rolling_release_publication.sh

      - name: Validate rolling release state transitions
        run: node --test scripts/rolling_release_state.test.js

      - name: Validate release build identity
        run: node --test scripts/release_build_identity.test.js

      - name: Validate milestone payload handoff
        run: node --test scripts/milestone_payload.test.js

      - name: Validate milestone release publication
        run: ./tests/test_milestone_release_publication.sh

      - name: Validate Sparkle monotonic release guard
        run: node --test scripts/sparkle_monotonic_guard.test.js

      - name: Validate release asset guard
        run: node scripts/release_asset_guard.test.js

      - name: Validate Sparkle enclosure naming and pruning
        run: node --test scripts/sparkle_enclosure.test.js

  shared-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Validate shared core
        run: |
          cargo fmt --manifest-path core/Cargo.toml --all -- --check
          cargo test --manifest-path core/Cargo.toml --workspace --locked
          cargo test --manifest-path core/crates/programa-terminal/Cargo.toml --locked

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate and build Windows executable
        shell: pwsh
        env:
          PROGRAMA_CI_BUILD: ${{ github.run_id }}
          PROGRAMA_CI_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/build-windows.ps1 -Version '0.0.0' -Build $env:PROGRAMA_CI_BUILD -Commit $env:PROGRAMA_CI_COMMIT -OutputDirectory "$env:RUNNER_TEMP/programa-windows-ci"

      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: programa-windows-ci
          path: ${{ runner.temp }}/programa-windows-ci/*.exe
          if-no-files-found: error

  unit-tests:
    needs: change-detection
    if: needs.change-detection.outputs.run_app_jobs == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROGRAMA_DERIVED_DATA_DIR: ${{ github.workspace }}/.ci-derived-data-unit
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Prefer Xcode 26 (macOS 26 SDK) so NSGlassEffectView / Liquid Glass compiles;
          # fall back to the image default when no Xcode 26 install exists.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_APP" ] && [ -d "/Applications/Xcode.app" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          XCODE_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR" || true
          xcodebuild -version

      - name: Verify native tab-strip hit testing
        run: swift test --package-path vendor/bonsplit --filter BonsplitTests/testTabBarDragZoneUsesSuperviewCoordinatesAndYieldsToControls

      - name: Validate Release reload artifact discovery
        run: ./tests/test_reloadp_programa_artifact.sh

      - name: Validate Ghostty cache revision
        run: ./tests/test_ghostty_cache_revision.sh

      - name: Validate CI change classification
        run: ./tests/test_ci_change_classification.sh

      - name: Validate reload entrypoint artifacts and dependency preparation
        run: ./tests/test_reload_entrypoints_artifacts.sh

      - name: Resolve Ghostty revision
        id: ghostty-revision
        run: |
          set -euo pipefail
          revision="$(./scripts/ghostty_cache_revision.sh)"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-v3-${{ steps.ghostty-revision.outputs.revision }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install zig
        run: |
          ZIG_REQUIRED="$(./scripts/required-zig-version.sh)"
          if command -v zig >/dev/null 2>&1 && [ "$(zig version 2>/dev/null)" = "$ZIG_REQUIRED" ]; then
            echo "zig ${ZIG_REQUIRED} already installed"
          else
            echo "Installing zig ${ZIG_REQUIRED} from tarball"
            curl -fSL "https://ziglang.org/download/${ZIG_REQUIRED}/zig-aarch64-macos-${ZIG_REQUIRED}.tar.xz" -o /tmp/zig.tar.xz
            tar xf /tmp/zig.tar.xz -C /tmp
            sudo mkdir -p /usr/local/bin /usr/local/lib
            sudo cp -f /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/zig /usr/local/bin/zig
            sudo cp -rf /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/lib /usr/local/lib/zig
            export PATH="/usr/local/bin:$PATH"
            zig version
          fi

      - name: Cache Zig packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Cache DerivedData
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.PROGRAMA_DERIVED_DATA_DIR }}
          key: deriveddata-tests-macos26-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-tests-macos26-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            deriveddata-tests-macos26-

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .ci-source-packages
          key: spm-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project GhosttyTabs.xcodeproj -scheme programa-unit -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      # Build and exercise the standalone CLI before the long XCTest bundle. This
      # keeps parser/security regressions observable even when an unrelated UI
      # unit test flakes later in the job.
      - name: Build programa CLI regression target
        run: |
          CLI_REGRESSION_DIR="$RUNNER_TEMP/programa-cli-regression"
          rm -rf "$CLI_REGRESSION_DIR"
          xcodebuild -project GhosttyTabs.xcodeproj \
            -target programa-cli \
            -configuration Debug \
            SYMROOT="$CLI_REGRESSION_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run typed CLI registry behavior regression
        run: |
          set -euo pipefail

          CLI_BIN="$RUNNER_TEMP/programa-cli-regression/Debug/programa"
          if [ -z "${CLI_BIN:-}" ] || [ ! -x "$CLI_BIN" ]; then
            echo "programa CLI binary not found in DerivedData" >&2
            exit 1
          fi

          PROGRAMA_CLI_BIN="$CLI_BIN" python3 tests/test_cli_registry_behavior.py

      - name: Run CLI argument grammar regression
        run: |
          set -euo pipefail

          CLI_BIN="$RUNNER_TEMP/programa-cli-regression/Debug/programa"
          if [ -z "${CLI_BIN:-}" ] || [ ! -x "$CLI_BIN" ]; then
            echo "programa CLI binary not found in DerivedData" >&2
            exit 1
          fi

          PROGRAMA_CLI_BIN="$CLI_BIN" python3 tests/test_cli_argument_grammar.py

      - name: Run Codex hook trust regression
        run: |
          set -euo pipefail

          CLI_BIN="$RUNNER_TEMP/programa-cli-regression/Debug/programa"
          if [ -z "${CLI_BIN:-}" ] || [ ! -x "$CLI_BIN" ]; then
            echo "programa CLI binary not found in DerivedData" >&2
            exit 1
          fi

          PROGRAMA_CLI_BIN="$CLI_BIN" python3 tests/test_cli_codex_hook_trust.py

      - name: Run unit tests
        env:
          PROGRAMA_UNIT_TEST_SCOPE: split-stateful
        run: ./scripts/ci-run-unit-tests.sh

      - name: Collect ghostty crash reports on failure
        if: failure()
        run: |
          mkdir -p /tmp/programa-unit-xcresults
          cp -R "$HOME/.local/state/ghostty/crash" /tmp/programa-unit-xcresults/ghostty-crash 2>/dev/null || true

      - name: Collect debug symbols for crash symbolication
        if: failure()
        # The crash reports above are sentry-native minidumps, which are useless
        # without the exact binary that produced them: a CI-only Debug build that
        # exists nowhere else. Two separate investigations of the same crash-loop
        # burned hours doing unsymbolicated image-offset matching because this
        # step did not exist. Copy the built products (Debug carries DWARF inside
        # the binaries) plus any dSYMs, so `lldb -o "target create --core <dmp>"`
        # can resolve frames to function names.
        run: |
          set -uo pipefail
          DERIVED="${PROGRAMA_DERIVED_DATA_DIR:-$HOME/Library/Developer/Xcode/DerivedData}"
          OUT=/tmp/programa-unit-xcresults/symbols
          mkdir -p "$OUT"
          find "$DERIVED" -maxdepth 5 -type d \( -name '*.app' -o -name '*.dSYM' \) -print0 2>/dev/null \
            | xargs -0 -I{} cp -R {} "$OUT/" 2>/dev/null || true
          # UUID index so a dump's debug_id can be matched to a file without
          # unpacking every bundle.
          find "$OUT" -type f -perm +111 -print0 2>/dev/null \
            | xargs -0 dwarfdump --uuid 2>/dev/null > "$OUT/uuids.txt" || true
          du -sh "$OUT" || true

      - name: Upload unit-test result bundles on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-xcresults-${{ github.run_attempt }}
          path: /tmp/programa-unit-xcresults/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run bundled Ghostty theme picker helper regression
        run: |
          set -euo pipefail
          PROGRAMA_SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages" \
            ./tests/test_bundled_ghostty_theme_picker_helper.sh

      - name: Run CLI version memory guard regression
        run: |
          set -euo pipefail

          CLI_BIN="$RUNNER_TEMP/programa-cli-regression/Debug/programa"
          if [ -z "${CLI_BIN:-}" ] || [ ! -x "$CLI_BIN" ]; then
            echo "programa CLI binary not found at the job's exact build path" >&2
            exit 1
          fi

          PROGRAMA_CLI_BIN="$CLI_BIN" python3 tests/test_cli_version_memory_guard.py

  socket-integration-tests:
    needs: change-detection
    if: needs.change-detection.outputs.run_app_jobs == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PROGRAMA_DERIVED_DATA_DIR: ${{ github.workspace }}/.ci-derived-data-socket-integration
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Prefer Xcode 26 (macOS 26 SDK) so NSGlassEffectView / Liquid Glass compiles;
          # fall back to the image default when no Xcode 26 install exists.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_APP" ] && [ -d "/Applications/Xcode.app" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          XCODE_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR" || true
          xcodebuild -version

      - name: Resolve Ghostty revision
        id: ghostty-revision
        run: |
          set -euo pipefail
          revision="$(./scripts/ghostty_cache_revision.sh)"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit-tests-v2
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-v3-${{ steps.ghostty-revision.outputs.revision }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit-tests-v2.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install zig
        run: |
          ZIG_REQUIRED="$(./scripts/required-zig-version.sh)"
          if command -v zig >/dev/null 2>&1 && [ "$(zig version 2>/dev/null)" = "$ZIG_REQUIRED" ]; then
            echo "zig ${ZIG_REQUIRED} already installed"
          else
            echo "Installing zig ${ZIG_REQUIRED} from tarball"
            curl -fSL "https://ziglang.org/download/${ZIG_REQUIRED}/zig-aarch64-macos-${ZIG_REQUIRED}.tar.xz" -o /tmp/zig.tar.xz
            tar xf /tmp/zig.tar.xz -C /tmp
            sudo mkdir -p /usr/local/bin /usr/local/lib
            sudo cp -f /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/zig /usr/local/bin/zig
            sudo cp -rf /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/lib /usr/local/lib/zig
            export PATH="/usr/local/bin:$PATH"
            zig version
          fi

      - name: Cache Zig packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Cache DerivedData
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.PROGRAMA_DERIVED_DATA_DIR }}
          key: deriveddata-tests-v2-path2-macos15-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-tests-v2-path2-macos15-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            deriveddata-tests-v2-path2-macos15-

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .ci-source-packages
          key: spm-tests-v2-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-tests-v2-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Build app
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$PROGRAMA_DERIVED_DATA_DIR" \
            -destination "platform=macOS" build

      - name: Create virtual display
        run: |
          set -euo pipefail
          clang -framework Foundation -framework CoreGraphics \
            -o /tmp/create-virtual-display scripts/create-virtual-display.m
          /tmp/create-virtual-display &
          VDISPLAY_PID=$!
          echo "VDISPLAY_PID=$VDISPLAY_PID" >> "$GITHUB_ENV"
          sleep 3
          kill -0 "$VDISPLAY_PID"

      - name: Run tests_v2 curated CI subset
        run: ./scripts/run-tests-v2-ci.sh

      - name: Cleanup virtual display
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${VDISPLAY_PID:-}" ]; then
            kill "$VDISPLAY_PID" >/dev/null 2>&1 || true
          fi
          rm -f /tmp/create-virtual-display

  tests-build-and-lag:
    needs:
      - unit-tests
      - change-detection
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.change-detection.outputs.run_app_jobs == 'true'
    # Build the full cmux scheme and run the lag regression on GitHub-hosted runners.
    # Keep lag validation separate from UI regressions so functional UI failures
    # and performance regressions stay isolated. Broader interactive UI suites
    # still run via test-e2e.yml on GitHub-hosted runners.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PROGRAMA_DERIVED_DATA_DIR: ${{ github.workspace }}/.ci-derived-data-lag
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Prefer Xcode 26 (macOS 26 SDK) so NSGlassEffectView / Liquid Glass compiles;
          # fall back to the image default when no Xcode 26 install exists.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_APP" ] && [ -d "/Applications/Xcode.app" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          XCODE_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR" || true
          xcodebuild -version

      - name: Resolve Ghostty revision
        id: ghostty-revision
        run: |
          set -euo pipefail
          revision="$(./scripts/ghostty_cache_revision.sh)"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit-lag
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-v3-${{ steps.ghostty-revision.outputs.revision }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit-lag.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install zig
        run: |
          ZIG_REQUIRED="$(./scripts/required-zig-version.sh)"
          if command -v zig >/dev/null 2>&1 && [ "$(zig version 2>/dev/null)" = "$ZIG_REQUIRED" ]; then
            echo "zig ${ZIG_REQUIRED} already installed"
          else
            echo "Installing zig ${ZIG_REQUIRED} from tarball"
            curl -fSL "https://ziglang.org/download/${ZIG_REQUIRED}/zig-aarch64-macos-${ZIG_REQUIRED}.tar.xz" -o /tmp/zig.tar.xz
            tar xf /tmp/zig.tar.xz -C /tmp
            sudo mkdir -p /usr/local/bin /usr/local/lib
            sudo cp -f /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/zig /usr/local/bin/zig
            sudo cp -rf /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/lib /usr/local/lib/zig
            export PATH="/usr/local/bin:$PATH"
            zig version
          fi

      - name: Cache Zig packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Cache DerivedData
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.PROGRAMA_DERIVED_DATA_DIR }}
          key: deriveddata-build-path2-macos26-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-build-path2-macos26-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            deriveddata-build-path2-macos26-

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .ci-source-packages
          key: spm-build-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-build-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Build app
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$PROGRAMA_DERIVED_DATA_DIR" \
            -destination "platform=macOS" build

      - name: Create virtual display
        run: |
          set -euo pipefail
          clang -framework Foundation -framework CoreGraphics \
            -o /tmp/create-virtual-display scripts/create-virtual-display.m
          /tmp/create-virtual-display &
          VDISPLAY_PID=$!
          echo "VDISPLAY_PID=$VDISPLAY_PID" >> "$GITHUB_ENV"
          sleep 3
          kill -0 "$VDISPLAY_PID"

      - name: Run workspace churn typing-lag regression
        run: |
          set -euo pipefail

          APP="$(./scripts/locate-built-app.sh \
            --configuration Debug \
            --primary "Programa DEV" \
            --derived-data-root "$PROGRAMA_DERIVED_DATA_DIR")"

          TAG="ci-lag"
          SOCK="/tmp/programa-debug-${TAG}.sock"
          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" 2>/dev/null \
              || echo 'com.darkroom.programa.debug'
          )"

          pkill -x "Programa DEV" || true
          rm -f "$SOCK" "/tmp/programa-${TAG}.sock" || true
          defaults write "$BUNDLE_ID" socketControlMode -string full >/dev/null 2>&1 || true

          PROGRAMA_TAG="$TAG" PROGRAMA_SOCKET_PATH="$SOCK" PROGRAMA_UI_TEST_MODE=1 "$APP/Contents/MacOS/Programa DEV" >/tmp/programa-ci-lag.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" >/dev/null 2>&1 || true' EXIT

          for _ in {1..240}; do
            [ -S "$SOCK" ] && break
            sleep 0.25
          done
          [ -S "$SOCK" ] || { echo "Socket not ready at $SOCK" >&2; exit 1; }

          PROGRAMA_SOCKET_PATH="$SOCK" \
          PROGRAMA_LAG_MAX_P95_RATIO=1.70 \
          PROGRAMA_LAG_MAX_AVG_RATIO=1.70 \
          PROGRAMA_LAG_MIN_BASELINE_P95_MS_FOR_RATIO=6.0 \
          PROGRAMA_LAG_MIN_BASELINE_AVG_MS_FOR_RATIO=4.0 \
          PROGRAMA_LAG_MAX_P95_DELTA_MS=20.0 \
          PROGRAMA_LAG_MAX_AVG_DELTA_MS=12.0 \
          PROGRAMA_LAG_MAX_CHURN_P95_MS=35 \
          PROGRAMA_LAG_KEY_EVENTS=180 \
          PROGRAMA_LAG_KEY_COMBO="${{ inputs.lag_combo || 'up' }}" \
          python3 tests_v2/test_workspace_churn_up_arrow_lag.py

      - name: Compare Liquid Glass OFF and ON (report only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          APP="$(./scripts/locate-built-app.sh \
            --configuration Debug \
            --primary "Programa DEV" \
            --derived-data-root "$PROGRAMA_DERIVED_DATA_DIR")"
          PROGRAMA_LAG_KEY_COMBO="${{ inputs.lag_combo || 'up' }}" \
            ./scripts/run-glass-perf-gate.sh "$APP" "${{ inputs.glass_surface || 'window' }}"

      # On-demand only. This measures the refresh call itself with an in-process
      # timer rather than an end-to-end socket round trip, because that round trip
      # is order-milliseconds and cannot resolve a change of this size -- four runs
      # of the forceRefresh change produced completely overlapping ranges (#183).
      #
      # Runs in its own app instance: the sampler only records when
      # PROGRAMA_TYPING_TIMING_LOGS=1, and enabling that for the lag harness above
      # would add logging to the very path that harness measures.
      #
      # Reports numbers, asserts no budget. There is no baseline yet, and a
      # threshold invented before any data would be a number from nowhere.
      - name: Measure text-input refresh cost (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          APP="$(./scripts/locate-built-app.sh \
            --configuration Debug \
            --primary "Programa DEV" \
            --derived-data-root "$PROGRAMA_DERIVED_DATA_DIR")"

          TAG="ci-refresh-cost"
          SOCK="/tmp/programa-debug-${TAG}.sock"
          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" 2>/dev/null \
              || echo 'com.darkroom.programa.debug'
          )"

          pkill -x "Programa DEV" || true
          rm -f "$SOCK" || true
          defaults write "$BUNDLE_ID" socketControlMode -string full >/dev/null 2>&1 || true

          PROGRAMA_TAG="$TAG" PROGRAMA_SOCKET_PATH="$SOCK" PROGRAMA_UI_TEST_MODE=1 \
            PROGRAMA_TYPING_TIMING_LOGS=1 \
            "$APP/Contents/MacOS/Programa DEV" >/tmp/programa-ci-refresh-cost.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" >/dev/null 2>&1 || true' EXIT

          for _ in {1..240}; do
            [ -S "$SOCK" ] && break
            sleep 0.25
          done
          [ -S "$SOCK" ] || { echo "Socket not ready at $SOCK" >&2; exit 1; }

          # Surface the app's own log on failure. Without this the step can only say
          # "Socket closed while waiting for response" -- which tells you the app died
          # or refused the connection, but not why, and its log sits on the runner
          # where nobody can read it. That cost a full four-run cycle to learn nothing.
          if ! PROGRAMA_SOCKET_PATH="$SOCK" \
               PROGRAMA_REFRESH_COST_KEY_EVENTS=400 \
               python3 tests_v2/test_text_input_refresh_cost.py | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "--- app still running? ---"
            pgrep -x "Programa DEV" >/dev/null && echo "yes" || echo "NO - it exited"
            echo "--- socket present at $SOCK? ---"
            [ -S "$SOCK" ] && echo "yes" || echo "NO"
            echo "--- tail of /tmp/programa-ci-refresh-cost.log ---"
            tail -80 /tmp/programa-ci-refresh-cost.log 2>/dev/null || echo "(no log)"
            exit 1
          fi

      - name: Cleanup virtual display
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${VDISPLAY_PID:-}" ]; then
            kill "$VDISPLAY_PID" >/dev/null 2>&1 || true
          fi
          rm -f /tmp/create-virtual-display

  ui-regressions:
    needs:
      - unit-tests
      - change-detection
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change-detection.outputs.run_app_jobs == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROGRAMA_DERIVED_DATA_DIR: ${{ github.workspace }}/.ci-derived-data-ui-regressions
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Prefer Xcode 26 (macOS 26 SDK) so NSGlassEffectView / Liquid Glass compiles;
          # fall back to the image default when no Xcode 26 install exists.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_APP" ] && [ -d "/Applications/Xcode.app" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          XCODE_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR" || true
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install zig
        run: |
          ZIG_REQUIRED="$(./scripts/required-zig-version.sh)"
          if command -v zig >/dev/null 2>&1 && [ "$(zig version 2>/dev/null)" = "$ZIG_REQUIRED" ]; then
            echo "zig ${ZIG_REQUIRED} already installed"
          else
            echo "Installing zig ${ZIG_REQUIRED} from tarball"
            curl -fSL "https://ziglang.org/download/${ZIG_REQUIRED}/zig-aarch64-macos-${ZIG_REQUIRED}.tar.xz" -o /tmp/zig.tar.xz
            tar xf /tmp/zig.tar.xz -C /tmp
            sudo mkdir -p /usr/local/bin /usr/local/lib
            sudo cp -f /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/zig /usr/local/bin/zig
            sudo cp -rf /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/lib /usr/local/lib/zig
            export PATH="/usr/local/bin:$PATH"
            zig version
          fi

      - name: Cache Zig packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Cache Swift packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .ci-source-packages
          key: spm-ui-regressions-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-ui-regressions-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Build for testing (display resolution)
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$PROGRAMA_DERIVED_DATA_DIR" \
            -destination "platform=macOS" \
            build-for-testing

      - name: Create persistent virtual display
        run: |
          set -euo pipefail
          HELPER_PATH="/tmp/create-virtual-display"
          clang -framework Foundation -framework CoreGraphics \
            -o "$HELPER_PATH" scripts/create-virtual-display.m

          VDISPLAY_READY="/tmp/programa-vdisplay-persistent.ready"
          VDISPLAY_ID_PATH="/tmp/programa-vdisplay-persistent.id"
          rm -f "$VDISPLAY_READY" "$VDISPLAY_ID_PATH"

          "$HELPER_PATH" \
            --modes "1920x1080" \
            --ready-path "$VDISPLAY_READY" \
            --display-id-path "$VDISPLAY_ID_PATH" \
            > /tmp/programa-vdisplay-persistent.log 2>&1 &
          echo "VDISPLAY_PERSISTENT_PID=$!" >> "$GITHUB_ENV"

          echo "Waiting for persistent virtual display..."
          for i in $(seq 1 24); do
            if [ -f "$VDISPLAY_READY" ]; then break; fi
            sleep 0.5
          done
          if [ ! -f "$VDISPLAY_READY" ]; then
            echo "ERROR: Persistent virtual display not ready after 12s" >&2
            cat /tmp/programa-vdisplay-persistent.log 2>/dev/null || true
            exit 1
          fi
          echo "Persistent virtual display ready: ID=$(cat "$VDISPLAY_ID_PATH")"

      - name: Run display resolution churn UI regression
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          HELPER_PATH="/tmp/create-virtual-display"
          TOKEN="$(uuidgen)"
          DIAG_PATH="/tmp/programa-ui-test-display-churn-${TOKEN}.json"
          DISPLAY_READY="/tmp/programa-ui-test-display-${TOKEN}.ready"
          DISPLAY_ID_PATH="/tmp/programa-ui-test-display-${TOKEN}.id"
          DISPLAY_START="/tmp/programa-ui-test-display-${TOKEN}.start"
          DISPLAY_DONE="/tmp/programa-ui-test-display-${TOKEN}.done"
          HELPER_LOG="/tmp/programa-ui-test-display-${TOKEN}-helper.log"

          cleanup() {
            pkill -x "Programa DEV" 2>/dev/null || true
            rm -f "$DIAG_PATH" "$DISPLAY_READY" "$DISPLAY_ID_PATH" "$DISPLAY_START" "$DISPLAY_DONE" "$HELPER_LOG"
            rm -f /tmp/programa-ui-test-prelaunch.json /tmp/programa-ui-test-display-harness.json
          }
          trap cleanup EXIT

          # Build display helper
          clang -framework Foundation -framework CoreGraphics \
            -o "$HELPER_PATH" scripts/create-virtual-display.m

          APP="$(./scripts/locate-built-app.sh \
            --configuration Debug \
            --primary "Programa DEV" \
            --derived-data-root "$PROGRAMA_DERIVED_DATA_DIR")"
          APP_BINARY="$APP/Contents/MacOS/Programa DEV"
          echo "App binary: $APP_BINARY"

          for attempt in 1 2; do
            cleanup 2>/dev/null || true

            # Launch display helper from shell (non-sandboxed).
            # Use --start-delay-ms instead of --start-path because the XCTest
            # runner is sandboxed and can't write to /tmp/ for the start signal.
            # 10s delay gives the test time to capture baseline render stats.
            "$HELPER_PATH" \
              --modes "1920x1080,1728x1117,1600x900,1440x810" \
              --ready-path "$DISPLAY_READY" \
              --display-id-path "$DISPLAY_ID_PATH" \
              --done-path "$DISPLAY_DONE" \
              --iterations 40 \
              --interval-ms 40 \
              --start-delay-ms 10000 \
              > "$HELPER_LOG" 2>&1 &
            HELPER_PID=$!

            # Wait for display ready
            echo "Waiting for virtual display..."
            for i in $(seq 1 24); do
              if [ -f "$DISPLAY_READY" ]; then break; fi
              sleep 0.5
            done
            if [ ! -f "$DISPLAY_READY" ]; then
              echo "ERROR: Virtual display not ready after 12s" >&2
              cat "$HELPER_LOG" 2>/dev/null || true
              continue
            fi
            DISPLAY_ID=$(cat "$DISPLAY_ID_PATH")
            echo "Virtual display ready: ID=$DISPLAY_ID"

            # Launch app from shell (non-sandboxed, outside XCTest sandbox)
            PROGRAMA_UI_TEST_MODE=1 \
            PROGRAMA_UI_TEST_DIAGNOSTICS_PATH="$DIAG_PATH" \
            PROGRAMA_UI_TEST_DISPLAY_RENDER_STATS=1 \
            PROGRAMA_UI_TEST_TARGET_DISPLAY_ID="$DISPLAY_ID" \
            PROGRAMA_TAG="ui-tests-display-resolution" \
            "$APP_BINARY" > /tmp/programa-ui-test-app.log 2>&1 &
            APP_PID=$!
            echo "App launched: PID=$APP_PID"

            # Wait for app diagnostics
            echo "Waiting for app diagnostics..."
            APP_READY=false
            for i in $(seq 1 30); do
              if [ -f "$DIAG_PATH" ]; then
                if python3 -c "import json; d=json.load(open('$DIAG_PATH')); assert d.get('pid')" 2>/dev/null; then
                  APP_READY=true
                  break
                fi
              fi
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                echo "ERROR: App crashed during startup"
                cat /tmp/programa-ui-test-app.log 2>/dev/null | tail -30 || true
                break
              fi
              sleep 0.5
            done

            if [ "$APP_READY" != "true" ]; then
              echo "Attempt $attempt: App not ready after 15s"
              pkill -x "Programa DEV" 2>/dev/null || true
              kill "$HELPER_PID" 2>/dev/null || true
              if [ "$attempt" -eq 2 ]; then
                echo "Display resolution UI regression failed after 2 attempts" >&2
                echo "--- App log ---"
                cat /tmp/programa-ui-test-app.log 2>/dev/null | tail -50 || true
                echo "--- Helper log ---"
                cat "$HELPER_LOG" 2>/dev/null | tail -20 || true
                echo "--- Diagnostics ---"
                cat "$DIAG_PATH" 2>/dev/null || echo "(not found)"
                exit 1
              fi
              sleep 3
              continue
            fi

            echo "App started. Diagnostics:"
            cat "$DIAG_PATH"

            # Wait for render stats (terminal surface initialization)
            echo "Waiting for render stats..."
            RENDER_READY=false
            for i in $(seq 1 40); do
              if python3 -c "import json; d=json.load(open('$DIAG_PATH')); assert d.get('renderStatsAvailable') == '1'" 2>/dev/null; then
                RENDER_READY=true
                echo "Render stats available after $((i / 2))s"
                break
              fi
              sleep 0.5
            done
            if [ "$RENDER_READY" != "true" ]; then
              echo "WARNING: Render stats not available after 20s. Diagnostics:"
              cat "$DIAG_PATH" 2>/dev/null || true
              echo "--- App log ---"
              cat /tmp/programa-ui-test-app.log 2>/dev/null | tail -30 || true
            fi

            # Write manifests so test can find the pre-launched state
            MANIFEST_PATH="/tmp/programa-ui-test-display-harness.json"
            cat >"$MANIFEST_PATH" <<MANIFEST_EOF
          {"readyPath":"$DISPLAY_READY","displayIDPath":"$DISPLAY_ID_PATH","donePath":"$DISPLAY_DONE","logPath":"$HELPER_LOG"}
          MANIFEST_EOF

            PRELAUNCH_PATH="/tmp/programa-ui-test-prelaunch.json"
            cat >"$PRELAUNCH_PATH" <<PRELAUNCH_EOF
          {"diagnosticsPath":"$DIAG_PATH"}
          PRELAUNCH_EOF

            # Run test — app is already launched from shell
            if xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -derivedDataPath "$PROGRAMA_DERIVED_DATA_DIR" \
              -destination "platform=macOS" \
              -only-testing:programaUITests/DisplayResolutionRegressionUITests \
              test-without-building; then
              exit 0
            fi

            pkill -x "Programa DEV" 2>/dev/null || true
            kill "$HELPER_PID" 2>/dev/null || true

            if [ "$attempt" -eq 2 ]; then
              echo "Display resolution UI regression failed after 2 attempts" >&2
              exit 1
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 3
          done

      - name: Run browser find focus UI regression
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          xcodebuild -project GhosttyTabs.xcodeproj -scheme programa -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$PROGRAMA_DERIVED_DATA_DIR" \
            -destination "platform=macOS" \
            -maximum-test-execution-time-allowance 180 \
            -only-testing:programaUITests/BrowserPaneNavigationKeybindUITests/testCmdFFocusesBrowserFindFieldAfterCmdDCmdLNavigation \
            test-without-building

      - name: Cleanup persistent virtual display
        if: always()
        run: |
          if [ -n "${VDISPLAY_PERSISTENT_PID:-}" ]; then
            kill "$VDISPLAY_PERSISTENT_PID" >/dev/null 2>&1 || true
          fi
          rm -f /tmp/programa-vdisplay-persistent.ready /tmp/programa-vdisplay-persistent.id /tmp/programa-vdisplay-persistent.log
